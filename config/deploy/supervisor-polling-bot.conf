[program:rova-polling-bot]
; Telegram polling bot — supervisor konfiguratsiyasi
; Joylashtirish: /etc/supervisor/conf.d/rova-polling-bot.conf
; Keyin: supervisorctl reread && supervisorctl update && supervisorctl start rova-polling-bot

command=php /var/www/rova_uc/bot/polling.php
directory=/var/www/rova_uc
user=www-data
autostart=true
autorestart=true
startretries=5
startsecs=3

; Loglarga yozish
stdout_logfile=/var/log/supervisor/rova-polling-bot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/rova-polling-bot-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

; Muhit o'zgaruvchilari
environment=HOME="/var/www",APP_ENV="production"

; Signal: SIGTERM bilan to'xtatish
stopsignal=SIGTERM
stopwaitsecs=10
